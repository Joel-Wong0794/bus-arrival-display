<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <title>Bus Arrivals</title>
    <script src="https://unpkg.com/htmx.org@2"></script>
    <script src="{{ url_for('static', filename='services.js') }}"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div
      id="dashboard"
      hx-get="/arrivals"
      hx-trigger="load, every {{ refresh_seconds }}s, refresh"
      hx-swap="innerHTML"
    >
      <p class="loading">Loading arrivals&hellip;</p>
    </div>
    <button type="button" id="edit-toggle">Edit</button>
    <script>
      // The server bakes in a minute count at fetch time; age it down locally so
      // the tile is never stale between polls (or while Android throttles them).
      // Must match BUFFER_SECONDS on the server, or the number would jump every
      // time htmx swaps in a freshly-rendered fragment.
      var BUFFER_MS = {{ buffer_seconds }} * 1000;
      function tickEtas() {
        var now = Date.now();
        // Indexed loop, not NodeList.forEach — the kiosk WebView is old.
        var els = document.querySelectorAll(".eta[data-arrival]");
        for (var i = 0; i < els.length; i++) {
          // Math.floor, mirroring the server's int(seconds // 60).
          var mins = Math.floor(
            (els[i].getAttribute("data-arrival") - now - BUFFER_MS) / 60000
          );
          var arriving = mins <= 0;
          var soon = !arriving && mins <= 5;
          els[i].textContent = arriving ? "Arr" : mins + " min";
          // className, not classList — the kiosk WebView is old.
          els[i].className = arriving ? "eta arriving" : soon ? "eta soon" : "eta";
        }
      }
      // The fragment is replaced wholesale every poll, so hiding has to be
      // re-applied after each swap or hidden services reappear on the next tick.
      function applyHidden() {
        var rows = document.querySelectorAll("#dashboard li[data-service]");
        for (var i = 0; i < rows.length; i++) {
          var row = rows[i];
          var off = Services.isHidden(
            row.getAttribute("data-stop"),
            row.getAttribute("data-service")
          );
          // In edit mode every row stays visible, otherwise you could not find
          // a hidden one to bring back.
          row.hidden = off && !Services.editing;
          // className, not classList, and a class rather than :has() — both
          // are absent from the kiosk WebView.
          row.className = off ? "svc-off" : "";
          var box = row.querySelector(".svc-toggle");
          if (box) box.checked = !off;
        }
        var note = document.getElementById("hidden-note");
        if (note) {
          var n = Services.count();
          note.hidden = n === 0 || Services.editing;
          note.textContent = n + (n === 1 ? " hidden" : " hidden") + " · ";
        }
      }

      var editToggle = document.getElementById("edit-toggle");
      editToggle.addEventListener("click", function () {
        Services.editing = !Services.editing;
        document.body.setAttribute(
          "data-editing",
          Services.editing ? "1" : ""
        );
        editToggle.textContent = Services.editing ? "Done" : "Edit";
        applyHidden();
      });

      // Delegated, so it survives every swap of the fragment beneath it.
      document.getElementById("dashboard").addEventListener("change", function (event) {
        var row = event.target.parentNode;
        if (!row || !row.getAttribute || !row.getAttribute("data-service")) return;
        Services.toggle(
          row.getAttribute("data-stop"),
          row.getAttribute("data-service")
        );
        applyHidden();
      });

      setInterval(tickEtas, 1000);
      document.body.addEventListener("htmx:afterSwap", function () {
        tickEtas();
        applyHidden();
      });
      // Waking the tablet resumes a throttled poll timer only on its next tick.
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) htmx.trigger("#dashboard", "refresh");
      });
    </script>
  </body>
</html>
