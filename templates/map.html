<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buses near home</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/htmx.org@2"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='map.css') }}" />
  </head>
  <body>
    <header class="map-header">
      <h1>Buses near home</h1>
      <a class="map-back" href="/">Arrivals</a>
    </header>

    {% if not home_missing %}
    <div id="map" class="map-frame"></div>
    {% endif %}

    <!-- No "load" trigger: the first render is already server-side, so the page
         costs one API call rather than two. -->
    <div
      id="bus-list"
      hx-get="/map-list"
      hx-trigger="every {{ refresh_seconds }}s, refresh"
      hx-swap="innerHTML"
    >
      {% include "_map_list.html" %}
    </div>

    <p class="map-legend">
      <span class="dot arriving"></span> Arriving
      <span class="dot soon"></span> Within {{ window_minutes }} min
      <span class="dot home"></span> Home
    </p>

    {% if not home_missing %}
    <script>
      var HOME = [{{ home_lat }}, {{ home_lon }}];

      var map = L.map("map", { zoomControl: true }).setView(HOME, 15);

      L.tileLayer("https://www.onemap.gov.sg/maps/tiles/Night/{z}/{x}/{y}.png", {
        minZoom: 11,
        maxZoom: 19,
        detectRetina: true,
        // Required by SLA's terms of use.
        attribution:
          '<img src="https://www.onemap.gov.sg/web-assets/images/logo/om_logo.png" style="height:18px;vertical-align:middle"> ' +
          'OneMap | Map data &copy; contributors, ' +
          '<a href="https://www.sla.gov.sg/">Singapore Land Authority</a>',
      }).addTo(map);

      L.marker(HOME, {
        icon: L.divIcon({ className: "home-pin", html: "", iconSize: [16, 16] }),
        zIndexOffset: 1000,
      })
        .addTo(map)
        .bindPopup("Home");

      // Keyed by vehicle so a refresh moves a marker rather than replacing it —
      // rebuilding them would slam shut any popup that was open.
      var markers = {};
      var fitted = false;

      function syncMarkers() {
        var rows = document.querySelectorAll("#bus-list .bus-row[data-lat]");
        var seen = {};
        var points = [HOME];

        for (var i = 0; i < rows.length; i++) {
          var row = rows[i];
          var key = row.getAttribute("data-key");
          var at = [
            parseFloat(row.getAttribute("data-lat")),
            parseFloat(row.getAttribute("data-lon")),
          ];
          seen[key] = true;
          points.push(at);

          var tier = row.getAttribute("data-tier");
          var no = row.getAttribute("data-no");
          var destination = row.getAttribute("data-destination");
          // Vehicle type lives here rather than on the pin: the popup is the
          // one place it surfaces on a touch screen, where :hover never fires.
          var parts = [row.getAttribute("data-distance")];
          if (row.getAttribute("data-type")) parts.push(row.getAttribute("data-type"));
          if (row.getAttribute("data-load")) parts.push(row.getAttribute("data-load"));
          var detail =
            "<b>" + no + "</b>" +
            (destination ? " " + destination : "") +
            " &middot; " + row.getAttribute("data-eta") +
            "<br>at " + row.getAttribute("data-stop") +
            "<br>" + parts.join(" &middot; ");

          if (markers[key]) {
            markers[key].setLatLng(at);
            markers[key].setIcon(busIcon(no, tier));
            markers[key].getPopup().setContent(detail);
          } else {
            markers[key] = L.marker(at, { icon: busIcon(no, tier) })
              .addTo(map)
              .bindPopup(detail);
          }
        }

        for (var key in markers) {
          if (!seen[key]) {
            map.removeLayer(markers[key]);
            delete markers[key];
          }
        }

        // Frame everything once. Re-fitting on each poll would yank the map back
        // every 10 seconds and fight any panning.
        if (!fitted && points.length > 1) {
          map.fitBounds(L.latLngBounds(points), { padding: [40, 40], maxZoom: 17 });
          fitted = true;
        }
      }

      function busIcon(no, tier) {
        return L.divIcon({
          className: "",
          html: '<span class="bus-pin ' + tier + '">' + no + "</span>",
          iconSize: [0, 0],
        });
      }

      function focusBus(row) {
        var marker = markers[row.getAttribute("data-key")];
        if (!marker) return;
        var frame = document.getElementById("map");
        // Tapping a row far down the list is pointless if the map has been
        // scrolled off the top of the screen.
        if (frame.getBoundingClientRect().bottom < 80) {
          frame.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        map.panTo(marker.getLatLng());
        marker.openPopup();
      }

      // Delegated, so the handler survives every htmx swap of the rows. Rows
      // without a position carry no data-lat and stay inert.
      var list = document.getElementById("bus-list");
      list.addEventListener("click", function (event) {
        var row = event.target.closest(".bus-row[data-lat]");
        if (row) focusBus(row);
      });
      list.addEventListener("keydown", function (event) {
        if (event.key !== "Enter" && event.key !== " ") return;
        var row = event.target.closest(".bus-row[data-lat]");
        if (!row) return;
        event.preventDefault();
        focusBus(row);
      });

      document.body.addEventListener("htmx:afterSwap", syncMarkers);
      syncMarkers();

      // Waking the phone resumes a throttled poll only on its next tick.
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) htmx.trigger("#bus-list", "refresh");
      });
    </script>
    {% endif %}
  </body>
</html>
