<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buses near home</title>
    <script src="https://unpkg.com/htmx.org@2"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='map.css') }}" />
  </head>
  <body>
    <header class="map-header">
      <h1>Buses near home</h1>
      <a class="map-back" href="/">Arrivals</a>
    </header>

    <div class="map-frame">
      <iframe
        id="map-frame"
        src="{{ map_url }}"
        title="OneMap showing buses arriving within {{ window_minutes }} minutes"
      ></iframe>
    </div>

    <!-- No "load" trigger: the first render is already server-side, so the page
         costs one API call rather than two. -->
    <div
      id="bus-list"
      hx-get="/map-list"
      hx-trigger="every {{ refresh_seconds }}s, refresh"
      hx-swap="innerHTML"
    >
      {% include "_map_list.html" %}
    </div>

    <p class="map-legend">
      <span class="dot arriving"></span> Arriving
      <span class="dot soon"></span> Within {{ window_minutes }} min
      <span class="dot home"></span> Home
    </p>

    <script>
      // Re-point the iframe only when a pin has actually moved. The feed
      // publishes every 20s and the list polls faster than that, so reloading
      // the map on every poll would reload OneMap's whole app — and visibly
      // flicker it — to redraw identical pins.
      function syncMap() {
        var carrier = document.getElementById("map-url");
        var frame = document.getElementById("map-frame");
        if (!carrier || !frame) return;
        var next = carrier.getAttribute("data-url");
        // getAttribute, not .src: the property resolves to an absolute URL and
        // would never compare equal to the attribute string.
        if (next && frame.getAttribute("src") !== next) frame.setAttribute("src", next);
      }
      document.body.addEventListener("htmx:afterSwap", syncMap);
      // Waking the phone resumes a throttled poll only on its next tick.
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) htmx.trigger("#bus-list", "refresh");
      });
    </script>
  </body>
</html>
